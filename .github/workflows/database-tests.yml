name: Database and workflow tests

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run tests
        run: dotnet test Tests/MinistryTracker.Tests/MinistryTracker.Tests.csproj --configuration Release

      - name: Check vulnerable dependencies
        run: |
          dotnet list MinistryTracker.csproj package --vulnerable --include-transitive | tee vulnerable-packages.txt
          ! grep -q "has the following vulnerable packages" vulnerable-packages.txt
